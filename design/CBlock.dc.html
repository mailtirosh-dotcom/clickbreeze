      <li>They are not told who blocked them.</li>
      <li>Unblock anytime in Profile › Blocked photographers.</li>
    </ul>
    <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px">
      <legend style="font-size: 14px; font-weight: 600; margin-bottom: 8px">Reason (optional)</legend>

      <label style="display: flex; align-items: center; gap: 10px; min-height: 44px; font-size: 15px"><input type="radio" name="why" style="width: 20px; height: 20px"> Bad past experience</label>
      <label style="display: flex; align-items: center; gap: 10px; min-height: 44px; font-size: 15px"><input type="radio" name="why" style="width: 20px; height: 20px"> Other</label>
    </fieldset>
    <label style="display: flex; align-items: center; gap: 10px; min-height: 44px; font-size: 15px; padding: 0 12px; border-radius: 10px; background: #F5F5F4"><input type="checkbox" style="width: 20px; height: 20px"> Also report to ClickBreeze</label>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
