<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Set studio location</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C2410C}a:hover{color:#9A3412}
button,input{font:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; font-family: Inter, sans-serif; color: #1C1917; background: #F5F5F4; display: flex; flex-direction: column; overflow: hidden">
  <header style="background: #1C1917; color: #FFFFFF; padding: 20px 16px 16px; display: flex; flex-direction: column; gap: 10px">
    <a href="PMap.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; color: #D6D3D1; font-size: 14px; text-decoration: none">&larr; Back</a>
    <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700">Set your studio location</h1>
    <label style="display: block">
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search an address or landmark</span>
      <input type="search" placeholder="Search an address or landmark" style="box-sizing: border-box; width: 100%; height: 44px; border: 0; border-radius: 10px; padding: 0 14px; background: #FFFFFF; color: #1C1917; font-size: 15px">
    </label>
  </header>

  <div style="position: relative; height: 400px; flex: none; overflow: hidden; background: #EFEBE4">
    <svg viewBox="0 0 390 400" width="390" height="400" aria-hidden="true" style="position: absolute; inset: 0">
      <rect width="390" height="400" fill="#EFEBE4"/>
      <path d="M0 320 C80 298 140 348 230 326 S340 286 390 306 L390 400 L0 400Z" fill="#BFDBEA"/>
      <rect x="250" y="30" width="110" height="80" rx="14" fill="#CFE3C4"/>
      <path d="M-10 180 L400 222" stroke="#FFFFFF" stroke-width="10" fill="none"/>
      <path d="M120 -10 L182 410" stroke="#FFFFFF" stroke-width="10" fill="none"/>
      <path d="M-10 90 L400 60" stroke="#FFFFFF" stroke-width="7" fill="none"/>
      <path d="M300 -10 L262 410" stroke="#FAF8F4" stroke-width="5" fill="none"/>
      <path d="M-10 262 L400 282" stroke="#FAF8F4" stroke-width="5" fill="none"/>
      <text x="24" y="162" font-size="11" fill="#78716C" font-family="Inter, sans-serif">[TOWN]</text>
    </svg>

    <!-- service area -->
    <div aria-hidden="true" style="position: absolute; left: 60px; top: 60px; width: 270px; height: 270px; border-radius: 50%; border: 2px dashed #C2410C; background: rgba(194,65,12,0.08)"></div>

    <!-- draggable pin -->
    <div role="slider" aria-label="Studio location pin. Drag to move." aria-valuetext="[ADDRESS FROM PIN]" tabindex="0" style="position: absolute; left: 195px; top: 210px; transform: translate(-50%, -100%); display: flex; flex-direction: column; align-items: center; cursor: grab; touch-action: none; min-width: 44px">
      <span style="padding: 4px 10px; border-radius: 8px; background: #1C1917; color: #FFFFFF; font-size: 12px; font-weight: 600; margin-bottom: 4px; white-space: nowrap">Drag to move</span>
      <svg width="40" height="52" viewBox="0 0 22 28" aria-hidden="true" style="filter: drop-shadow(0 3px 3px rgba(0,0,0,0.35))"><path d="M11 0C5 0 0 4.6 0 10.6 0 18 11 28 11 28s11-10 11-17.4C22 4.6 17 0 11 0z" fill="#C2410C"/><circle cx="11" cy="10.6" r="4" fill="#FFFFFF"/></svg>
    </div>
    <div aria-hidden="true" style="position: absolute; left: 195px; top: 210px; width: 14px; height: 6px; margin-left: -7px; border-radius: 50%; background: rgba(0,0,0,0.25)"></div>

    <div style="position: absolute; right: 12px; top: 12px; display: flex; flex-direction: column; gap: 8px">
      <button type="button" aria-label="Zoom in" style="width: 44px; height: 44px; border-radius: 10px; border: 1px solid #D6D3D1; background: #FFFFFF; font-size: 22px; font-weight: 600; cursor: pointer">+</button>
      <button type="button" aria-label="Zoom out" style="width: 44px; height: 44px; border-radius: 10px; border: 1px solid #D6D3D1; background: #FFFFFF; font-size: 22px; font-weight: 600; cursor: pointer">&minus;</button>
      <button type="button" aria-label="Use my current location" style="width: 44px; height: 44px; border-radius: 10px; border: 1px solid #D6D3D1; background: #FFFFFF; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1C1917" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></button>
    </div>
    <div style="position: absolute; left: 8px; bottom: 6px; padding: 2px 6px; border-radius: 4px; background: rgba(255,255,255,0.85); font-size: 11px; color: #44403C">OpenFreeMap &copy; OpenMapTiles · Data from OpenStreetMap</div>
  </div>

  <div style="flex: 1; padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 12px; overflow: hidden">
    <section style="background: #FFFFFF; border: 1px solid #E7E5E4; border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px">
      <div style="font-size: 12px; font-weight: 600; color: #57534E">PIN ADDRESS</div>
      <div style="font-size: 15px; font-weight: 600">[ADDRESS FROM PIN]</div>
      <div style="font-size: 13px; color: #57534E">[TOWN] · [DISTRICT]</div>
    </section>
    <div>
      <div id="rad-h" style="font-size: 13px; font-weight: 600; color: #57534E; margin-bottom: 6px">I take bookings within</div>
      <div role="radiogroup" aria-labelledby="rad-h" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
        <button type="button" role="radio" aria-checked="false" style="height: 44px; border-radius: 8px; border: 1px solid #A8A29E; background: #FFFFFF; font-weight: 600; font-size: 14px">5 km</button>
        <button type="button" role="radio" aria-checked="false" style="height: 44px; border-radius: 8px; border: 1px solid #A8A29E; background: #FFFFFF; font-weight: 600; font-size: 14px">10 km</button>
        <button type="button" role="radio" aria-checked="true" style="height: 44px; border-radius: 8px; border: 2px solid #C2410C; background: #FFEDD5; color: #9A3412; font-weight: 600; font-size: 14px">15 km</button>
        <button type="button" role="radio" aria-checked="false" style="height: 44px; border-radius: 8px; border: 1px solid #A8A29E; background: #FFFFFF; font-weight: 600; font-size: 14px">25 km</button>
      </div>
    </div>
    <div style="font-size: 13px; color: #57534E">Customers see only an approximate circle until they confirm your bid.</div>
    <a href="PMap.dc.html" style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 10px; background: #C2410C; color: #FFFFFF; font-weight: 600; font-size: 16px; text-decoration: none">Save location</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
