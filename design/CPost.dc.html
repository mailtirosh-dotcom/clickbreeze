<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Post requirement</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C2410C}a:hover{color:#9A3412}
input,select{font:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; font-family: Inter, sans-serif; color: #1C1917; background: #FFFFFF; display: flex; flex-direction: column; overflow: hidden">
  <header style="padding: 20px 16px 12px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <div style="font-size: 13px; color: #57534E">Step 1 of 2</div>
      <div role="group" aria-label="Language" style="display: flex; gap: 4px; background: #F5F5F4; padding: 3px; border-radius: 999px">
        <button type="button" aria-pressed="true" style="height: 44px; padding: 0 16px; border: 0; border-radius: 999px; background: #1C1917; color: #FFFFFF; font-weight: 600; font-size: 14px">English</button>
        <button type="button" aria-pressed="false" style="height: 44px; padding: 0 16px; border: 0; border-radius: 999px; background: transparent; color: #1C1917; font-size: 14px">தமிழ்</button>
      </div>
    </div>
    <h1 style="margin: 4px 0 0; font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700">What do you need shot?</h1>
  </header>
  <form style="flex: 1; padding: 0 16px; display: flex; flex-direction: column; gap: 16px; overflow: hidden">
    <fieldset style="border: 0; margin: 0; padding: 0">
      <legend style="font-size: 14px; font-weight: 500; margin-bottom: 8px">Event type</legend>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <label style="display: flex; align-items: center; justify-content: center; height: 48px; border-radius: 10px; border: 2px solid #C2410C; background: #FFF7ED; font-size: 14px; font-weight: 600"><input type="radio" name="ev" checked style="position: absolute; opacity: 0"> Wedding</label>
        <label style="display: flex; align-items: center; justify-content: center; height: 48px; border-radius: 10px; border: 1px solid #D6D3D1; font-size: 14px"><input type="radio" name="ev" style="position: absolute; opacity: 0"> Birthday</label>
        <label style="display: flex; align-items: center; justify-content: center; height: 48px; border-radius: 10px; border: 1px solid #D6D3D1; font-size: 14px"><input type="radio" name="ev" style="position: absolute; opacity: 0"> Product</label>
        <label style="display: flex; align-items: center; justify-content: center; height: 48px; border-radius: 10px; border: 1px solid #D6D3D1; font-size: 14px"><input type="radio" name="ev" style="position: absolute; opacity: 0"> Portrait</label>
        <label style="display: flex; align-items: center; justify-content: center; height: 48px; border-radius: 10px; border: 1px solid #D6D3D1; font-size: 14px"><input type="radio" name="ev" style="position: absolute; opacity: 0"> Event</label>
        <label style="display: flex; align-items: center; justify-content: center; height: 48px; border-radius: 10px; border: 1px solid #D6D3D1; font-size: 14px"><input type="radio" name="ev" style="position: absolute; opacity: 0"> Other</label>
      </div>
    </fieldset>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 500">Date<input type="date" style="height: 44px; border: 1px solid #A8A29E; border-radius: 8px; padding: 0 10px"></label>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 500">Hours<input type="number" value="8" style="height: 44px; border: 1px solid #A8A29E; border-radius: 8px; padding: 0 10px"></label>
    </div>
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 500">District<select style="height: 44px; border: 1px solid #A8A29E; border-radius: 8px; padding: 0 10px; background: #FFFFFF"><option>Select district</option></select></label>
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 500">Town / village<select style="height: 44px; border: 1px solid #A8A29E; border-radius: 8px; padding: 0 10px; background: #FFFFFF"><option>Select town or village</option></select></label>
    <fieldset style="border: 0; margin: 0; padding: 0">
      <legend style="font-size: 14px; font-weight: 500; margin-bottom: 8px">Who can bid first?</legend>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; background: #F5F5F4; padding: 4px; border-radius: 10px">
        <label style="display: flex; align-items: center; justify-content: center; height: 44px; border-radius: 8px; background: #1C1917; color: #FFFFFF; font-size: 14px; font-weight: 600"><input type="radio" name="reach" checked style="position: absolute; opacity: 0"> Town</label>
        <label style="display: flex; align-items: center; justify-content: center; height: 44px; border-radius: 8px; font-size: 14px"><input type="radio" name="reach" style="position: absolute; opacity: 0"> District</label>
        <label style="display: flex; align-items: center; justify-content: center; height: 44px; border-radius: 8px; font-size: 14px"><input type="radio" name="reach" style="position: absolute; opacity: 0"> State</label>
      </div>
      <p style="margin: 8px 0 0; font-size: 13px; color: #57534E">No confirmed bid in time? It widens to the next level automatically.</p>
    </fieldset>
  </form>
  <div style="padding: 12px 16px 20px; border-top: 1px solid #E7E5E4">
    <a href="CBids.dc.html" style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 10px; background: #C2410C; color: #FFFFFF; font-weight: 600; font-size: 16px; text-decoration: none">Post and get bids</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
