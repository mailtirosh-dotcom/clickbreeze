<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bids on map</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C2410C}a:hover{color:#9A3412}
button{font:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; font-family: Inter, sans-serif; color: #1C1917; background: #F5F5F4; display: flex; flex-direction: column; overflow: hidden">
  <header style="background: #1C1917; color: #FFFFFF; padding: 20px 16px 16px; display: flex; flex-direction: column; gap: 10px">
    <div style="font-size: 13px; color: #D6D3D1">Wedding · Sun, [DATE] · [TOWN]</div>
    <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700">6 bids near your venue</h1>
    <div role="tablist" aria-label="View" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; background: #292524; padding: 4px; border-radius: 10px">
      <a role="tab" aria-selected="false" href="CBids.dc.html" style="display: flex; align-items: center; justify-content: center; height: 40px; border-radius: 8px; color: #E7E5E4; font-size: 14px; text-decoration: none">List</a>
      <a role="tab" aria-selected="true" href="CMap.dc.html" style="display: flex; align-items: center; justify-content: center; height: 40px; border-radius: 8px; background: #C2410C; color: #FFFFFF; font-weight: 600; font-size: 14px; text-decoration: none">Map</a>
    </div>
  </header>

  <div style="position: relative; height: 420px; flex: none; overflow: hidden; background: #EFEBE4">
    <svg viewBox="0 0 390 420" width="390" height="420" aria-hidden="true" style="position: absolute; inset: 0">
      <rect width="390" height="420" fill="#EFEBE4"/>
      <path d="M0 340 C80 318 140 368 230 346 S340 306 390 326 L390 420 L0 420Z" fill="#BFDBEA"/>
      <rect x="250" y="36" width="110" height="82" rx="14" fill="#CFE3C4"/>
      <path d="M-10 190 L400 232" stroke="#FFFFFF" stroke-width="10" fill="none"/>
      <path d="M120 -10 L182 430" stroke="#FFFFFF" stroke-width="10" fill="none"/>
      <path d="M-10 92 L400 62" stroke="#FFFFFF" stroke-width="7" fill="none"/>
      <path d="M300 -10 L262 430" stroke="#FAF8F4" stroke-width="5" fill="none"/>
      <path d="M-10 270 L400 290" stroke="#FAF8F4" stroke-width="5" fill="none"/>
      <text x="24" y="172" font-size="11" fill="#78716C" font-family="Inter, sans-serif">[TOWN]</text>
      <text x="268" y="82" font-size="11" fill="#4D7C3F" font-family="Inter, sans-serif">[PARK]</text>
    </svg>

    <!-- approximate bid areas -->
    <div aria-hidden="true" style="position: absolute; left: 106px; top: 106px; width: 88px; height: 88px; border-radius: 50%; background: rgba(194,65,12,0.2); border: 2px solid #C2410C"></div>
    <div aria-hidden="true" style="position: absolute; left: 234px; top: 74px; width: 72px; height: 72px; border-radius: 50%; background: rgba(87,83,78,0.16); border: 2px solid #78716C"></div>
    <div aria-hidden="true" style="position: absolute; left: 260px; top: 210px; width: 80px; height: 80px; border-radius: 50%; background: rgba(87,83,78,0.16); border: 2px solid #78716C"></div>
    <div aria-hidden="true" style="position: absolute; left: 76px; top: 266px; width: 68px; height: 68px; border-radius: 50%; background: rgba(87,83,78,0.16); border: 2px solid #78716C"></div>
    <div aria-hidden="true" style="position: absolute; left: 190px; top: 300px; width: 60px; height: 60px; border-radius: 50%; background: rgba(87,83,78,0.16); border: 2px solid #78716C"></div>

    <!-- venue -->
    <div style="position: absolute; left: 200px; top: 210px; transform: translate(-50%, -100%); display: flex; flex-direction: column; align-items: center">
      <span style="padding: 2px 8px; border-radius: 6px; background: #1C1917; color: #FFFFFF; font-size: 11px; font-weight: 600">Your venue</span>
      <svg width="22" height="28" viewBox="0 0 22 28" aria-hidden="true"><path d="M11 0C5 0 0 4.6 0 10.6 0 18 11 28 11 28s11-10 11-17.4C22 4.6 17 0 11 0z" fill="#1C1917"/><circle cx="11" cy="10.6" r="4" fill="#FFFFFF"/></svg>
    </div>

    <!-- price markers -->
    <button type="button" aria-label="[STUDIO NAME], lowest bid, ₹[AMOUNT]" style="position: absolute; left: 150px; top: 150px; transform: translate(-50%, -50%); min-height: 44px; min-width: 44px; padding: 0; border: 0; background: none; cursor: pointer"><span style="display: inline-block; padding: 6px 10px; border-radius: 999px; background: #C2410C; color: #FFFFFF; font-weight: 700; font-size: 14px; border: 2px solid #FFFFFF; box-shadow: 0 1px 4px rgba(0,0,0,0.3)">₹[AMOUNT]</span></button>
    <button type="button" aria-label="Bid ₹[AMOUNT]" style="position: absolute; left: 270px; top: 110px; transform: translate(-50%, -50%); min-height: 44px; min-width: 44px; padding: 0; border: 0; background: none; cursor: pointer"><span style="display: inline-block; padding: 6px 10px; border-radius: 999px; background: #FFFFFF; color: #1C1917; font-weight: 700; font-size: 14px; border: 2px solid #78716C">₹[AMOUNT]</span></button>
    <button type="button" aria-label="Bid ₹[AMOUNT]" style="position: absolute; left: 300px; top: 250px; transform: translate(-50%, -50%); min-height: 44px; min-width: 44px; padding: 0; border: 0; background: none; cursor: pointer"><span style="display: inline-block; padding: 6px 10px; border-radius: 999px; background: #FFFFFF; color: #1C1917; font-weight: 700; font-size: 14px; border: 2px solid #78716C">₹[AMOUNT]</span></button>
    <button type="button" aria-label="Bid ₹[AMOUNT]" style="position: absolute; left: 110px; top: 300px; transform: translate(-50%, -50%); min-height: 44px; min-width: 44px; padding: 0; border: 0; background: none; cursor: pointer"><span style="display: inline-block; padding: 6px 10px; border-radius: 999px; background: #FFFFFF; color: #1C1917; font-weight: 700; font-size: 14px; border: 2px solid #78716C">₹[AMOUNT]</span></button>
    <button type="button" aria-label="Bid ₹[AMOUNT]" style="position: absolute; left: 220px; top: 330px; transform: translate(-50%, -50%); min-height: 44px; min-width: 44px; padding: 0; border: 0; background: none; cursor: pointer"><span style="display: inline-block; padding: 6px 10px; border-radius: 999px; background: #FFFFFF; color: #1C1917; font-weight: 700; font-size: 14px; border: 2px solid #78716C">₹[AMOUNT]</span></button>

    <!-- map controls -->
    <div style="position: absolute; right: 12px; top: 12px; display: flex; flex-direction: column; gap: 8px">
      <button type="button" aria-label="Zoom in" style="width: 44px; height: 44px; border-radius: 10px; border: 1px solid #D6D3D1; background: #FFFFFF; font-size: 22px; font-weight: 600; cursor: pointer">+</button>
      <button type="button" aria-label="Zoom out" style="width: 44px; height: 44px; border-radius: 10px; border: 1px solid #D6D3D1; background: #FFFFFF; font-size: 22px; font-weight: 600; cursor: pointer">&minus;</button>
      <button type="button" aria-label="Centre on my venue" style="width: 44px; height: 44px; border-radius: 10px; border: 1px solid #D6D3D1; background: #FFFFFF; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1C1917" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></button>
    </div>
    <div style="position: absolute; left: 8px; bottom: 6px; padding: 2px 6px; border-radius: 4px; background: rgba(255,255,255,0.85); font-size: 11px; color: #44403C">OpenFreeMap &copy; OpenMapTiles · Data from OpenStreetMap</div>
  </div>

  <div style="flex: 1; padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 10px; overflow: hidden">
    <div style="font-size: 13px; color: #57534E">Circles show the approximate area. Exact address and contact appear after you confirm.</div>
    <article style="background: #FFFFFF; border: 2px solid #C2410C; border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: center">
        <div><div style="font-weight: 600">[STUDIO NAME]</div><div style="font-size: 13px; color: #57534E">Studio · ★ 4.8 · about 3 km away</div></div>
        <div style="font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700">₹[AMOUNT]</div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <a href="CChat.dc.html" style="display: flex; align-items: center; justify-content: center; height: 44px; border-radius: 8px; border: 1px solid #A8A29E; color: #1C1917; font-weight: 600; text-decoration: none; font-size: 14px">Chat</a>
        <a href="CToken.dc.html" style="display: flex; align-items: center; justify-content: center; height: 44px; border-radius: 8px; background: #C2410C; color: #FFFFFF; font-weight: 600; text-decoration: none; font-size: 14px">Confirm bid</a>
      </div>
    </article>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
