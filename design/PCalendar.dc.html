<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Availability calendar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C2410C}a:hover{color:#9A3412}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; font-family: Inter, sans-serif; color: #1C1917; background: #F5F5F4; display: flex; flex-direction: column; overflow: hidden">
  <header style="background: #1C1917; color: #FFFFFF; padding: 20px 16px 16px">
    <div style="font-size: 13px; color: #D6D3D1">Your availability</div>
    <div style="font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700">Calendar</div>
  </header>
  <div style="flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 12px; overflow: hidden">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <button type="button" aria-label="Previous month" style="width: 44px; height: 44px; border: 1px solid #D6D3D1; border-radius: 22px; background: #FFFFFF; font-size: 18px">‹</button>
      <div style="font-weight: 600; font-size: 17px">November 2026</div>
      <button type="button" aria-label="Next month" style="width: 44px; height: 44px; border: 1px solid #D6D3D1; border-radius: 22px; background: #FFFFFF; font-size: 18px">›</button>
    </div>
    <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; text-align: center; font-size: 12px; font-weight: 600; color: #57534E">
      <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px">
      <button type="button" aria-label="Nov 1, available" style="aspect-ratio: 1; border-radius: 8px; border: 1px solid #E7E5E4; background: #FFFFFF; font-size: 15px">1</button>
      <button type="button" aria-label="Nov 2, available" style="aspect-ratio: 1; border-radius: 8px; border: 1px solid #E7E5E4; background: #FFFFFF; font-size: 15px">2</button>
      <button type="button" aria-label="Nov 3, available" style="aspect-ratio: 1; border-radius: 8px; border: 1px solid #E7E5E4; background: #FFFFFF; font-size: 15px">3</button>
      <button type="button" aria-label="Nov 4, available" style="aspect-ratio: 1; border-radius: 8px; border: 1px solid #E7E5E4; background: #FFFFFF; font-size: 15px">4</button>
      <button type="button" aria-label="Nov 5, blocked by you" style="aspect-ratio: 1; border-radius: 8px; border: 1px solid #A8A29E; background: #E7E5E4; color: #44403C; font-size: 15px">5</button>
      <button type="button" aria-label="Nov 6, blocked by you" style="aspect-ratio: 1; border-radius: 8px; border: 1px solid #A8A29E; background: #E7E5E4; color: #44403C; font-size: 15px">6</button>
      <button type="button" aria-label="Nov 7, available" style="aspect-ratio: 1; border-radius: 8px; border: 1px solid #E7E5E4; background: #FFFFFF; font-size: 15px">7</button>
      <button type="button" aria-label="Nov 8, available" style="aspect-ratio: 1; border-radius: 8px; border: 1px solid #E7E5E4; background: #FFFFFF; font-size: 15px">8</button>
      <button type="button" aria-label="Nov 9, available" style="aspect-ratio: 1; border-radius: 8px; border: 1px solid #E7E5E4; background: #FFFFFF; font-size: 15px">9</button>
      <button type="button" aria-label="Nov 10, available" style="aspect-ratio: 1; border-radius: 8px; border: 1px solid #E7E5E4; background: #FFFFFF; font-size: 15px">10</button>
      <button type="button" aria-label="Nov 11, available" style="aspect-ratio: 1; border-radius: 8px; border: 1px solid #E7E5E4; background: #FFFFFF; font-size: 15px">11</button>
      <button type="button" aria-label="Nov 12, available" style="aspect-ratio: 1; border-radius: 8px; border: 1px solid #E7E5E4; background: #FFFFFF; font-size: 15px">12</button>
      <button type="button" aria-label="Nov 13, available" style="aspect-ratio: 1; border-radius: 8px; border: 1px solid #E7E5E4; background: #FFFFFF; font-size: 15px">13</button>
      <button type="button" aria-label="Nov 14, booked" style="aspect-ratio: 1; border-radius: 8px; border: 1px solid #FDBA74; background: #FFEDD5; color: #9A3412; font-weight: 600; font-size: 15px">14</button>
      <button type="button" aria-label="Nov 15, available" style="aspect-ratio: 1; border-radius: 8px; border: 1px solid #E7E5E4; background: #FFFFFF; font-size: 15px">15</button>
      <button type="button" aria-label="Nov 16, available" style="aspect-ratio: 1; border-radius: 8px; border: 1px solid #E7E5E4; background: #FFFFFF; font-size: 15px">16</button>
      <button type="button" aria-label="Nov 17, available" style="aspect-ratio: 1; border-radius: 8px; border: 1px solid #E7E5E4; background: #FFFFFF; font-size: 15px">17</button>
      <button type="button" aria-label="Nov 18, available" style="aspect-ratio: 1; border-radius: 8px; border: 1px solid #E7E5E4; background: #FFFFFF; font-size: 15px">18</button>
      <button type="button" aria-label="Nov 19, available" style="aspect-ratio: 1; border-radius: 8px; border: 1px solid #E7E5E4; background: #FFFFFF; font-size: 15px">19</button>
      <button type="button" aria-label="Nov 20, available" style="aspect-ratio: 1; border-radius: 8px; border: 1px solid #E7E5E4; background: #FFFFFF; font-size: 15px">20</button>
      <button type="button" aria-label="Nov 21, booked" style="aspect-ratio: 1; border-radius: 8px; border: 1px solid #FDBA74; background: #FFEDD5; color: #9A3412; font-weight: 600; font-size: 15px">21</button>
      <button type="button" aria-label="Nov 22, available" style="aspect-ratio: 1; border-radius: 8px; border: 1px solid #E7E5E4; background: #FFFFFF; font-size: 15px">22</button>
      <button type="button" aria-label="Nov 23, available" style="aspect-ratio: 1; border-radius: 8px; border: 1px solid #E7E5E4; background: #FFFFFF; font-size: 15px">23</button>
      <button type="button" aria-label="Nov 24, available" style="aspect-ratio: 1; border-radius: 8px; border: 1px solid #E7E5E4; background: #FFFFFF; font-size: 15px">24</button>
      <button type="button" aria-label="Nov 25, available" style="aspect-ratio: 1; border-radius: 8px; border: 1px solid #E7E5E4; background: #FFFFFF; font-size: 15px">25</button>
      <button type="button" aria-label="Nov 26, available" style="aspect-ratio: 1; border-radius: 8px; border: 1px solid #E7E5E4; background: #FFFFFF; font-size: 15px">26</button>
      <button type="button" aria-label="Nov 27, available" style="aspect-ratio: 1; border-radius: 8px; border: 1px solid #E7E5E4; background: #FFFFFF; font-size: 15px">27</button>
      <button type="button" aria-label="Nov 28, booked" style="aspect-ratio: 1; border-radius: 8px; border: 1px solid #FDBA74; background: #FFEDD5; color: #9A3412; font-weight: 600; font-size: 15px">28</button>
      <button type="button" aria-label="Nov 29, available" style="aspect-ratio: 1; border-radius: 8px; border: 1px solid #E7E5E4; background: #FFFFFF; font-size: 15px">29</button>
      <button type="button" aria-label="Nov 30, available" style="aspect-ratio: 1; border-radius: 8px; border: 1px solid #E7E5E4; background: #FFFFFF; font-size: 15px">30</button>
    </div>
    <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 13px; color: #44403C">
      <li style="display: flex; align-items: center; gap: 6px"><span aria-hidden="true" style="width: 14px; height: 14px; border-radius: 4px; border: 1px solid #E7E5E4; background: #FFFFFF"></span>Available</li>
      <li style="display: flex; align-items: center; gap: 6px"><span aria-hidden="true" style="width: 14px; height: 14px; border-radius: 4px; border: 1px solid #FDBA74; background: #FFEDD5"></span>Booked on ClickBreeze</li>
      <li style="display: flex; align-items: center; gap: 6px"><span aria-hidden="true" style="width: 14px; height: 14px; border-radius: 4px; border: 1px solid #A8A29E; background: #E7E5E4"></span>Blocked by me</li>
    </ul>
    <p style="margin: 0; font-size: 13px; color: #57534E">You won't see bids for booked or blocked dates. Tap a date to block or unblock it.</p>
  </div>
  <nav aria-label="Main" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: #FFFFFF; border-top: 1px solid #E7E5E4; height: 64px">
    <a href="PFeed.dc.html" style="display: flex; align-items: center; justify-content: center; font-size: 13px; color: #57534E; text-decoration: none">Bids</a>
    <a href="#" style="display: flex; align-items: center; justify-content: center; font-size: 13px; color: #57534E; text-decoration: none">My bids</a>
    <a href="#" aria-current="page" style="display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; color: #C2410C; text-decoration: none">Calendar</a>
    <a href="PDeliver.dc.html" style="display: flex; align-items: center; justify-content: center; font-size: 13px; color: #57534E; text-decoration: none">Orders</a>
    <a href="#" style="display: flex; align-items: center; justify-content: center; font-size: 13px; color: #57534E; text-decoration: none">Profile</a>
  </nav>
</div>
</x-dc>
