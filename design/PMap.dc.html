<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nearby bids map</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C2410C}a:hover{color:#9A3412}
button,input{font:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; font-family: Inter, sans-serif; color: #1C1917; background: #F5F5F4; display: flex; flex-direction: column; overflow: hidden">
  <header style="background: #1C1917; color: #FFFFFF; padding: 20px 16px 16px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <div>
        <div style="font-size: 13px; color: #D6D3D1">Verified photographer</div>
        <div style="font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700">Nearby bids</div>
      </div>
      <div role="tablist" aria-label="View" style="display: grid; grid-template-columns: repeat(2, 64px); gap: 4px; background: #292524; padding: 4px; border-radius: 10px">
        <a role="tab" aria-selected="false" href="PFeed.dc.html" style="display: flex; align-items: center; justify-content: center; height: 40px; border-radius: 8px; color: #E7E5E4; font-size: 14px; text-decoration: none">List</a>
        <a role="tab" aria-selected="true" href="PMap.dc.html" style="display: flex; align-items: center; justify-content: center; height: 40px; border-radius: 8px; background: #C2410C; color: #FFFFFF; font-weight: 600; font-size: 14px; text-decoration: none">Map</a>
      </div>
    </div>
    <label style="display: block">
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search a town or area</span>
      <input type="search" placeholder="Search a town or area" style="box-sizing: border-box; width: 100%; height: 44px; border: 0; border-radius: 10px; padding: 0 14px; background: #FFFFFF; color: #1C1917; font-size: 15px">
    </label>
    <div role="tablist" aria-label="Bid reach" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; background: #292524; padding: 4px; border-radius: 10px">
      <button type="button" role="tab" aria-selected="true" style="height: 40px; border: 0; border-radius: 8px; background: #C2410C; color: #FFFFFF; font-weight: 600; font-size: 14px">My town · 3</button>
      <button type="button" role="tab" aria-selected="false" style="height: 40px; border: 0; border-radius: 8px; background: transparent; color: #E7E5E4; font-size: 14px">District · 8</button>
      <button type="button" role="tab" aria-selected="false" style="height: 40px; border: 0; border-radius: 8px; background: transparent; color: #E7E5E4; font-size: 14px">State · 21</button>
    </div>
  </header>

  <div style="position: relative; height: 410px; flex: none; overflow: hidden; background: #EFEBE4">
    <svg viewBox="0 0 390 410" width="390" height="410" aria-hidden="true" style="position: absolute; inset: 0">
      <rect width="390" height="410" fill="#EFEBE4"/>
      <path d="M0 330 C80 308 140 358 230 336 S340 296 390 316 L390 410 L0 410Z" fill="#BFDBEA"/>
      <rect x="250" y="30" width="110" height="80" rx="14" fill="#CFE3C4"/>
      <path d="M-10 190 L400 232" stroke="#FFFFFF" stroke-width="10" fill="none"/>
      <path d="M120 -10 L182 420" stroke="#FFFFFF" stroke-width="10" fill="none"/>
      <path d="M-10 92 L400 62" stroke="#FFFFFF" stroke-width="7" fill="none"/>
      <path d="M300 -10 L262 420" stroke="#FAF8F4" stroke-width="5" fill="none"/>
      <path d="M-10 270 L400 290" stroke="#FAF8F4" stroke-width="5" fill="none"/>
      <text x="24" y="172" font-size="11" fill="#78716C" font-family="Inter, sans-serif">[TOWN]</text>
    </svg>

    <!-- search radius around my studio -->
    <div aria-hidden="true" style="position: absolute; left: 70px; top: 80px; width: 260px; height: 260px; border-radius: 50%; border: 2px dashed #1C1917; background: rgba(28,25,23,0.04)"></div>

    <!-- requirement areas -->
    <div aria-hidden="true" style="position: absolute; left: 108px; top: 108px; width: 84px; height: 84px; border-radius: 50%; background: rgba(194,65,12,0.2); border: 2px solid #C2410C"></div>
    <div aria-hidden="true" style="position: absolute; left: 242px; top: 150px; width: 72px; height: 72px; border-radius: 50%; background: rgba(17,94,89,0.16); border: 2px solid #115E59"></div>
    <div aria-hidden="true" style="position: absolute; left: 130px; top: 250px; width: 66px; height: 66px; border-radius: 50%; background: rgba(87,83,78,0.16); border: 2px solid #78716C"></div>

    <!-- my studio -->
    <div style="position: absolute; left: 200px; top: 215px; transform: translate(-50%, -100%); display: flex; flex-direction: column; align-items: center">
      <span style="padding: 2px 8px; border-radius: 6px; background: #1C1917; color: #FFFFFF; font-size: 11px; font-weight: 600">My studio</span>
      <svg width="22" height="28" viewBox="0 0 22 28" aria-hidden="true"><path d="M11 0C5 0 0 4.6 0 10.6 0 18 11 28 11 28s11-10 11-17.4C22 4.6 17 0 11 0z" fill="#1C1917"/><circle cx="11" cy="10.6" r="4" fill="#FFFFFF"/></svg>
    </div>

    <!-- price markers -->
    <button type="button" aria-label="Wedding, lowest bid ₹[AMOUNT], 6 bids" style="position: absolute; left: 150px; top: 150px; transform: translate(-50%, -50%); min-height: 44px; min-width: 44px; padding: 0; border: 0; background: none; cursor: pointer"><span style="display: inline-block; padding: 6px 10px; border-radius: 999px; background: #C2410C; color: #FFFFFF; font-weight: 700; font-size: 14px; border: 2px solid #FFFFFF; box-shadow: 0 1px 4px rgba(0,0,0,0.3)">₹[AMOUNT]</span></button>
    <button type="button" aria-label="Birthday, lowest bid ₹[AMOUNT], 2 bids" style="position: absolute; left: 278px; top: 186px; transform: translate(-50%, -50%); min-height: 44px; min-width: 44px; padding: 0; border: 0; background: none; cursor: pointer"><span style="display: inline-block; padding: 6px 10px; border-radius: 999px; background: #FFFFFF; color: #1C1917; font-weight: 700; font-size: 14px; border: 2px solid #115E59">₹[AMOUNT]</span></button>
    <button type="button" aria-label="Product shoot, no bids yet" style="position: absolute; left: 163px; top: 283px; transform: translate(-50%, -50%); min-height: 44px; min-width: 44px; padding: 0; border: 0; background: none; cursor: pointer"><span style="display: inline-block; padding: 6px 10px; border-radius: 999px; background: #FFFFFF; color: #57534E; font-weight: 700; font-size: 14px; border: 2px dashed #78716C">Be first</span></button>

    <div style="position: absolute; left: 12px; top: 12px; padding: 6px 10px; border-radius: 999px; background: #FFFFFF; border: 1px solid #D6D3D1; font-size: 13px; font-weight: 600">Within 15 km of my studio</div>
    <div style="position: absolute; right: 12px; top: 12px; display: flex; flex-direction: column; gap: 8px">
      <button type="button" aria-label="Zoom in" style="width: 44px; height: 44px; border-radius: 10px; border: 1px solid #D6D3D1; background: #FFFFFF; font-size: 22px; font-weight: 600; cursor: pointer">+</button>
      <button type="button" aria-label="Zoom out" style="width: 44px; height: 44px; border-radius: 10px; border: 1px solid #D6D3D1; background: #FFFFFF; font-size: 22px; font-weight: 600; cursor: pointer">&minus;</button>
    </div>
    <div style="position: absolute; left: 8px; bottom: 6px; padding: 2px 6px; border-radius: 4px; background: rgba(255,255,255,0.85); font-size: 11px; color: #44403C">OpenFreeMap &copy; OpenMapTiles · Data from OpenStreetMap</div>
  </div>

  <div style="flex: 1; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; overflow: hidden">
    <article style="background: #FFFFFF; border: 2px solid #C2410C; border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: center">
        <span style="padding: 4px 10px; border-radius: 999px; background: #FFEDD5; color: #9A3412; font-size: 13px; font-weight: 600">Wedding</span>
        <span style="font-size: 13px; color: #B91C1C; font-weight: 600">Closes in 5h 20m</span>
      </div>
      <div style="font-weight: 600">Full-day wedding · [TOWN] · about 2 km</div>
      <div style="display: flex; justify-content: space-between; align-items: center">
        <div style="font-size: 13px; color: #57534E">6 bids · lowest <strong style="font-family: 'Space Grotesk', sans-serif; font-size: 18px; color: #1C1917">₹[AMOUNT]</strong></div>
        <a href="PBid.dc.html" style="display: flex; align-items: center; justify-content: center; height: 44px; padding: 0 20px; border-radius: 8px; background: #C2410C; color: #FFFFFF; font-weight: 600; text-decoration: none; font-size: 14px">Place a bid</a>
      </div>
    </article>
  </div>
  <nav aria-label="Main" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: #FFFFFF; border-top: 1px solid #E7E5E4; height: 64px">
    <a href="PFeed.dc.html" aria-current="page" style="display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; color: #C2410C; text-decoration: none">Bids</a>
    <a href="#" style="display: flex; align-items: center; justify-content: center; font-size: 13px; color: #57534E; text-decoration: none">My bids</a>
    <a href="PCalendar.dc.html" style="display: flex; align-items: center; justify-content: center; font-size: 13px; color: #57534E; text-decoration: none">Calendar</a>
    <a href="PDeliver.dc.html" style="display: flex; align-items: center; justify-content: center; font-size: 13px; color: #57534E; text-decoration: none">Orders</a>
    <a href="PLocation.dc.html" style="display: flex; align-items: center; justify-content: center; font-size: 13px; color: #57534E; text-decoration: none">Profile</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
