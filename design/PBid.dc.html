<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bid detail</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C2410C}a:hover{color:#9A3412}
input,select,textarea{font:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; font-family: Inter, sans-serif; color: #1C1917; background: #F5F5F4; display: flex; flex-direction: column; overflow: hidden">
  <header style="background: #FFFFFF; border-bottom: 1px solid #E7E5E4; padding: 12px 8px; display: flex; align-items: center; gap: 4px">
    <a href="PFeed.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #1C1917"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a>
    <div style="font-weight: 600; font-size: 17px">Bid detail</div>
  </header>
  <div style="flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 12px; overflow: hidden">
    <section style="background: #FFFFFF; border: 1px solid #E7E5E4; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
      <span style="align-self: flex-start; padding: 4px 10px; border-radius: 999px; background: #FFEDD5; color: #9A3412; font-size: 13px; font-weight: 600">Wedding · My town</span>
      <h1 style="margin: 0; font-size: 19px; font-weight: 600">Full-day wedding · photo + video</h1>
      <dl style="margin: 0; display: grid; grid-template-columns: 96px 1fr; row-gap: 8px; font-size: 14px">
        <dt style="color: #57534E">Date</dt><dd style="margin: 0">Sun, [DATE] · 7:00 AM</dd>
        <dt style="color: #57534E">Duration</dt><dd style="margin: 0">8 hours</dd>
        <dt style="color: #57534E">Location</dt><dd style="margin: 0">[TOWN], [DISTRICT]</dd>
        <dt style="color: #57534E">Needs</dt><dd style="margin: 0">Edited photos, highlight video, album</dd>
        <dt style="color: #57534E">Customer</dt><dd style="margin: 0">[FIRST NAME] · phone shown after confirmation</dd>
      </dl>
    </section>
    <section style="background: #1C1917; color: #FFFFFF; border-radius: 12px; padding: 16px; display: flex; justify-content: space-between; align-items: center">
      <div><div style="font-size: 13px; color: #D6D3D1">Current lowest bid</div><div style="font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 700">₹[AMOUNT]</div></div>
      <div style="text-align: right"><div style="font-size: 13px; color: #D6D3D1">Closes in</div><div style="font-weight: 600; color: #FDBA74">5h 20m</div></div>
    </section>
    <form style="background: #FFFFFF; border: 1px solid #E7E5E4; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 500">Your bid (₹)<input type="number" placeholder="Below current lowest" style="height: 48px; border: 2px solid #C2410C; border-radius: 8px; padding: 0 12px; font-size: 18px; font-weight: 600"></label>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 500">Package<select style="height: 44px; border: 1px solid #A8A29E; border-radius: 8px; padding: 0 12px; background: #FFFFFF"><option>[YOUR WEDDING PACKAGE]</option></select></label>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 500">Message to customer<textarea rows="2" placeholder="No phone numbers or links" style="border: 1px solid #A8A29E; border-radius: 8px; padding: 10px 12px"></textarea></label>
    </form>
  </div>
  <div style="padding: 12px 16px 20px; background: #FFFFFF; border-top: 1px solid #E7E5E4">
    <a href="PConfirmed.dc.html" style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 10px; background: #C2410C; color: #FFFFFF; font-weight: 600; font-size: 16px; text-decoration: none">Place bid</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
