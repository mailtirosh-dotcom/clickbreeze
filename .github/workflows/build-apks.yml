name: Build Android APKs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["apps/**", "shared/**", "scripts/**", ".github/workflows/build-apks.yml"]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [customer, photographer]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Install dependencies
        run: npm install
      - name: Build web files
        run: node ../../scripts/build.js ${{ matrix.app }}
      - name: Add Android project
        run: npx cap add android && npx cap sync android
      - name: Allow location (for "Use my location")
        run: |
          f=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <application#' $f
      - name: Build debug APK
        working-directory: apps/${{ matrix.app }}/android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: clickbreeze-${{ matrix.app }}-debug-apk
          path: apps/${{ matrix.app }}/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Attach APK to a GitHub Release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp apps/${{ matrix.app }}/android/app/build/outputs/apk/debug/app-debug.apk clickbreeze-${{ matrix.app }}.apk
          gh release view apks >/dev/null 2>&1 || gh release create apks --title "Latest debug APKs" --notes "Debug builds, replaced on every build." --prerelease
          gh release upload apks clickbreeze-${{ matrix.app }}.apk --clobber
